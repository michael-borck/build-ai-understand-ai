project:
  type: book
  output-dir: _book
  resources:
    - LICENSE
    - LICENSE-CONTENT.md
    - LICENSE-CODE.md

book:
  cover-image: cover.png
  favicon: favicon.svg
  title: "Build AI, Understand AI"
  subtitle: "How Today's LLM Systems Actually Work, in Small Readable Pieces"
  author: "Michael Borck"
  date: "last-modified"
  license: "CC BY 4.0 International"
  description: "Build tiny versions of chat, retrieval, agents, workflows and judges, and learn what the LLM systems you use every day actually are: one model call wrapped in plain Python. An optional final part opens the wider AI field and the training loop itself."
  site-url: https://michael-borck.github.io/build-ai-understand-ai
  repo-url: https://github.com/michael-borck/build-ai-understand-ai
  repo-branch: main
  repo-actions: [edit, issue]
  chapters:
    - index.qmd
    - copyright.qmd
    - part: "The Model"
      chapters:
        - chapters/one-call.qmd
        - chapters/who-the-model-is.qmd
        - chapters/no-memory.qmd
        - chapters/any-provider.qmd
    - part: "Grounding"
      chapters:
        - chapters/what-the-model-doesnt-know.qmd
        - chapters/chunk-fetch-answer.qmd
    - part: "Action"
      chapters:
        - chapters/giving-the-model-hands.qmd
        - chapters/the-react-loop.qmd
    - part: "Control"
      chapters:
        - chapters/workflows-as-folders.qmd
        - chapters/loops-with-a-goal.qmd
        - chapters/the-judge.qmd
        - chapters/typed-answers.qmd
    - part: "The Senses"
      chapters:
        - chapters/pictures.qmd
        - chapters/voice.qmd
    - part: "Inside the Box (Optional)"
      chapters:
        - chapters/the-older-ai.qmd
        - chapters/train-a-tiny-model.qmd
        - chapters/teach-it-a-dialect.qmd
    - part: "Looking Underneath"
      chapters:
        - chapters/conclusion.qmd
  appendices:
    - appendices/just-enough-python.qmd
    - appendices/model-access.qmd
    - appendices/project-gallery.qmd
    - appendices/going-deeper.qmd
    - acknowledgments.qmd
    - about-author.qmd
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 2
  other-links:
    - text: Download PDF
      icon: file-pdf
      href: /build-ai-understand-ai.pdf
    - text: Download EPUB
      icon: book
      href: /build-ai-understand-ai.epub
    - text: Download llm.txt
      icon: robot
      href: llm.txt
    - text: The Package (companion)
      icon: package
      href: https://michael-borck.github.io/hands-on-ai/
    - text: GitHub
      icon: github
      href: https://github.com/michael-borck/build-ai-understand-ai
    - text: DeepWiki
      icon: search
      href: https://deepwiki.com/michael-borck/build-ai-understand-ai
    - text: All Books
      icon: collection
      href: https://books.borck.education

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: book-design.css
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github
  pdf:
    pdf-engine: lualatex
    fontsize: 11pt
    linestretch: 1.08
    include-in-header: book-design.tex
    documentclass: book
    toc: true
    toc-depth: 1
    number-sections: true
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=1in
      - outer=0.625in
      - top=0.75in
      - bottom=0.75in
  epub:
    epub-cover-image: cover.png
    toc: true
    toc-depth: 1
    css: [epub-styles.css, book-design-epub.css]

execute:
  echo: true
  warning: false
  error: false
